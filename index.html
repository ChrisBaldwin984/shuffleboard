<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a130f">
<title>Shuffleboard Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-thumb pub scoreboard. Two puck-coloured columns side by side, big totals,
   tall +points buttons under each name, bottom tab bar. Committed to one dark "walnut table" look. */
:root {
  --bg: #1a130f;          /* dark walnut */
  --surface: #241a15;
  --surface-2: #2f231c;
  --line: #43332a;
  --fg: #f4ebe1;
  --muted: #b5a08e;
  --red: #e0483f;         /* red pucks */
  --blue: #3f8be0;        /* blue pucks */
  --gold: #f0b84a;        /* winner */
  --font-display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 500 16px/1.4 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.app {
  max-width: 620px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 14px;
}

/* ---------- header ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 900 26px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand small { display: block; font: 600 12px/1.2 var(--font-body); letter-spacing: .12em; color: var(--muted); margin-top: 4px; }
.ghost {
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; font-weight: 600; font-size: 14px; color: var(--fg); white-space: nowrap;
}
.ghost:active { background: var(--surface-2); }

/* ---------- court ---------- */
.court { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side {
  --puck: var(--red);
  background: color-mix(in srgb, var(--puck) 9%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--puck) 30%, var(--line));
  border-radius: var(--radius);
  padding: 12px 10px 10px;
  display: grid; gap: 10px; min-width: 0;
}
.side.blue { --puck: var(--blue); }
.side.lead { border-color: color-mix(in srgb, var(--puck) 75%, var(--line)); }
.who {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  background: none; border: 0; padding: 0; text-align: left;
}
.puck {
  flex: none; width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--puck) 60%, white) 0 18%, var(--puck) 45%);
  box-shadow: 0 0 0 3px #9aa0a6, 0 0 0 4px #00000066;
}
.name { font: 800 22px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .02em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.score {
  font: 900 clamp(76px, 25vw, 132px)/.85 var(--font-display);
  font-variant-numeric: tabular-nums; text-align: center; letter-spacing: -.01em;
}
.score.bump { animation: bump .22s ease-out; }
@keyframes bump { 40% { transform: scale(1.08); color: var(--gold); } }
.bar { height: 6px; border-radius: 3px; background: #00000055; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--puck); border-radius: 3px; transition: width .2s; }
.needs { font-size: 13px; color: var(--muted); text-align: center; font-weight: 600; }
.needs.win { color: var(--gold); }
.pts { display: grid; gap: 8px; }
.pt {
  height: 62px; border-radius: 12px;
  background: color-mix(in srgb, var(--puck) 26%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--puck) 55%, transparent);
  font: 800 32px/1 var(--font-display); letter-spacing: .02em;
  transition: transform .06s, background .1s;
  user-select: none; -webkit-user-select: none;
}
.pt:active { transform: scale(.96); background: color-mix(in srgb, var(--puck) 50%, var(--surface)); }
.pt span { font-size: .6em; opacity: .7; margin-right: 1px; vertical-align: .15em; }

/* ---------- controls under the court ---------- */
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  min-height: 50px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); font-weight: 700; font-size: 15px; padding: 8px 12px;
}
.btn:active { background: var(--line); }
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #24170a; }
.btn.primary:active { background: color-mix(in srgb, var(--gold) 80%, black); }
.btn.danger { color: #ff8a80; }
.btn small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.btn.primary small { color: #24170acc; }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; display: grid; gap: 10px; min-width: 0;
}
.label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.upnext { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.upnext strong { font: 800 20px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; }
.upnext span { color: var(--muted); font-size: 14px; }
.log { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  --puck: var(--red);
  font-size: 13px; font-weight: 600; padding: 4px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--puck) 20%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--puck) 40%, transparent);
}
.chip.blue { --puck: var(--blue); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

/* ---------- table / history ---------- */
h2.section { font: 900 30px/1 var(--font-display); text-transform: uppercase; margin: 6px 0 0; letter-spacing: .02em; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
th:first-child, td:first-child { text-align: left; }
td:first-child { font: 800 19px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; }
tr.top td:first-child::after { content: "TOP"; font: 700 10px/1 var(--font-body); letter-spacing: .1em;
  background: var(--gold); color: #24170a; padding: 3px 5px; border-radius: 4px; margin-left: 8px; vertical-align: 3px; }
.big { font: 800 22px/1 var(--font-display); }
.games { display: grid; gap: 0; }
.game {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.game:last-child { border-bottom: 0; }
.game .n { color: var(--muted); font-size: 12px; font-weight: 700; width: 2.6em; }
.game .res { min-width: 0; }
.game .res b { color: var(--gold); }
.game .res div { font-size: 12px; color: var(--muted); }
.game .sc { font: 800 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.x { background: none; border: 0; color: var(--muted); font-size: 20px; padding: 4px 8px; line-height: 1; }

/* ---------- setup ---------- */
.field { display: grid; gap: 6px; }
.field input[type=text], .field input[type=number], .prow input {
  width: 100%; min-width: 0; height: 48px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); padding: 0 12px; font-size: 17px; font-weight: 600;
}
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.prow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.prow .tag { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px; }
.seg button {
  min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
  font-weight: 700; font-size: 15px; padding: 6px 8px;
}
.seg button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg button small { display: block; font-weight: 500; font-size: 12px; opacity: .75; }

/* ---------- tab bar ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
}
.tabs nav { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tabs button {
  min-height: 48px; border-radius: 12px; border: 0; background: transparent;
  font: 800 18px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
}
.tabs button[aria-current=page] { background: var(--surface-2); color: var(--fg); }

/* ---------- sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 10; display: grid; align-items: end; }
.sheet .backdrop { position: absolute; inset: 0; background: #000000a8; }
.sheet .card {
  position: relative; width: 100%; max-width: 620px; margin: 0 auto;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 22px 22px 0 0;
  padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 12px; max-height: 90%; overflow-y: auto;
  animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sheet h3 { font: 900 36px/1 var(--font-display); text-transform: uppercase; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sheet .eyebrow { color: var(--gold); }
.sheet .final { font: 900 64px/1 var(--font-display); margin: 0; font-variant-numeric: tabular-nums; }
.sheet p { margin: 0; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.pick button {
  min-height: 54px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
  font: 800 20px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 10px;
}
.pick button[aria-pressed=true] { background: var(--gold); color: #24170a; border-color: var(--gold); }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center;
}
@media (min-width: 560px) {
  .pt { height: 68px; }
  .court { gap: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="app" id="app"></main>
<div class="tabs"><nav id="tabs" aria-label="Sections">
  <button data-act="tab" data-tab="play">Play</button>
  <button data-act="tab" data-tab="table">Table</button>
  <button data-act="tab" data-tab="setup">Setup</button>
</nav></div>
<div class="sheet" id="sheet" hidden><div class="backdrop" data-act="close"></div><div class="card" id="sheet-card" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  const KEY = "shuffleboard-scorer-v1";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- state ----------
  function fresh() {
    return {
      players: [
        { id: "p1", name: "Player 1" },
        { id: "p2", name: "Player 2" },
        { id: "p3", name: "Player 3" },
      ],
      settings: { target: 21, buttons: [1, 2, 3, 4, 6], mode: "turns" },
      game: newGame("p1", "p2"),
      queue: ["p3"],          // players waiting, front plays next
      streak: { p1: 0, p2: 0, p3: 0 }, // games in a row on the table
      history: [],
      gameNo: 1,
    };
  }
  function newGame(a, b) { return { a, b, log: [], ts: Date.now() }; }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.players && s.game && s.settings) return s;
    } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  let S = load() || fresh();
  let tab = "play";
  try { tab = localStorage.getItem(KEY + ":tab") || "play"; } catch (e) {}
  let bumpSide = null;

  const player = (id) => S.players.find((p) => p.id === id) || { id, name: "?" };
  const nameOf = (id) => player(id).name;
  const total = (side) => S.game.log.reduce((t, e) => t + (e.s === side ? e.v : 0), 0);

  // Who plays next. Pure: returns the next pairing without touching S.
  // "turns": whoever has been on the table longest steps off.
  // "winner": winner stays on, loser goes to the back of the queue.
  function nextMatch(winnerSide) {
    const { a, b } = S.game;
    const q = S.queue.filter((id) => S.players.some((p) => p.id === id));
    const streak = { ...S.streak };
    streak[a] = (streak[a] || 0) + 1;
    streak[b] = (streak[b] || 0) + 1;
    const W = winnerSide === "a" ? a : b, L = winnerSide === "a" ? b : a;
    if (!q.length) return { a: W, b: L, queue: q, streak, off: null };
    let off;
    if (S.settings.mode === "winner") off = L;
    else off = streak[b] > streak[a] ? b : a;
    const stay = off === a ? b : a;
    const inn = q.shift();
    q.push(off);
    streak[off] = 0;
    streak[inn] = 0;
    return { a: stay, b: inn, queue: q, streak, off };
  }

  // ---------- actions ----------
  function addPoints(side, v) {
    S.game.log.push({ s: side, v });
    bumpSide = side;
    buzz();
    save();
    render();
    const t = S.settings.target;
    if (t > 0 && total(side) >= t) openWin(side, true);
  }
  function undo() {
    const e = S.game.log.pop();
    if (!e) return;
    save(); render();
    toast(`Took off ${e.v} from ${nameOf(S.game[e.s])}`);
  }
  function commit(winnerSide) {
    const { a, b } = S.game;
    const sa = total("a"), sb = total("b");
    S.history.unshift({ n: S.gameNo, a, b, an: nameOf(a), bn: nameOf(b), sa, sb, w: winnerSide === "a" ? a : b, ts: Date.now() });
    const nx = nextMatch(winnerSide);
    S.queue = nx.queue;
    S.streak = nx.streak;
    S.game = newGame(nx.a, nx.b);
    S.gameNo++;
    save();
    closeSheet();
    render();
    toast(`Game ${S.gameNo}: ${nameOf(nx.a)} v ${nameOf(nx.b)}`);
  }
  function setPlayers(x, y) {
    const old = [S.game.a, S.game.b];
    let q = S.queue.filter((id) => id !== x && id !== y);
    old.forEach((id) => { if (id !== x && id !== y && !q.includes(id)) q.push(id); });
    S.players.forEach((p) => { if (p.id !== x && p.id !== y && !q.includes(p.id)) q.push(p.id); });
    S.queue = q;
    S.streak[x] = 0; S.streak[y] = 0;
    S.game = newGame(x, y);
    save();
  }

  // ---------- render ----------
  function render() {
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    const app = $("#app");
    if (tab === "table") app.innerHTML = viewTable();
    else if (tab === "setup") app.innerHTML = viewSetup();
    else app.innerHTML = viewPlay();
    bumpSide = null;
  }

  function sideHTML(side) {
    const id = S.game[side];
    const sc = total(side), other = total(side === "a" ? "b" : "a");
    const t = S.settings.target;
    const colour = side === "a" ? "red" : "blue";
    const needs = t > 0 ? (sc >= t ? `<p class="needs win">Winner</p>` : `<p class="needs">${t - sc} to win</p>`) : `<p class="needs">${sc === other ? "Level" : sc > other ? `Up by ${sc - other}` : `Down by ${other - sc}`}</p>`;
    const bar = t > 0 ? `<div class="bar" aria-hidden="true"><i style="width:${Math.min(100, (sc / t) * 100)}%"></i></div>` : "";
    const btns = S.settings.buttons.map((v) => `<button class="pt" data-act="add" data-side="${side}" data-v="${v}" aria-label="Add ${v} to ${esc(nameOf(id))}"><span>+</span>${v}</button>`).join("");
    return `<section class="side ${colour}${sc > other ? " lead" : ""}" aria-label="${esc(nameOf(id))}">
      <button class="who" data-act="rename" data-id="${id}" title="Rename"><i class="puck"></i><span class="name">${esc(nameOf(id))}</span></button>
      <div class="score${bumpSide === side ? " bump" : ""}" aria-live="polite">${sc}</div>
      ${bar}${needs}
      <div class="pts">${btns}</div>
    </section>`;
  }

  function viewPlay() {
    const t = S.settings.target;
    const last = S.game.log[S.game.log.length - 1];
    const waiting = S.queue.filter((id) => S.players.some((p) => p.id === id));
    let upnext = "";
    if (waiting.length) {
      if (S.settings.mode === "winner") {
        upnext = `<div class="upnext"><strong>Winner v ${esc(nameOf(waiting[0]))}</strong><span>Loser sits out</span></div>`;
      } else {
        const nx = nextMatch("a");
        upnext = `<div class="upnext"><strong>${esc(nameOf(nx.a))} v ${esc(nameOf(nx.b))}</strong><span>${esc(nameOf(nx.off))} sits out</span></div>`;
      }
      if (waiting.length > 1) upnext += `<p class="hint">Queue: ${waiting.map((id) => esc(nameOf(id))).join(", ")}</p>`;
    } else {
      upnext = `<div class="upnext"><strong>Rematch</strong><span>Add a third player in Setup to rotate</span></div>`;
    }
    const log = S.game.log.slice(-12).reverse().map((e) => `<span class="chip ${e.s === "a" ? "" : "blue"}">${esc(nameOf(S.game[e.s]))} +${e.v}</span>`).join("");
    return `
      <header class="topbar">
        <h1 class="brand">Game ${S.gameNo}<small>${t > 0 ? `First to ${t}` : "No target · end it yourself"}</small></h1>
        <button class="ghost" data-act="pick">Change players</button>
      </header>
      <div class="court">${sideHTML("a")}${sideHTML("b")}</div>
      <div class="controls">
        <button class="btn" data-act="undo" ${last ? "" : "disabled"}>Undo<small>${last ? `${esc(nameOf(S.game[last.s]))} +${last.v}` : "Nothing yet"}</small></button>
        <button class="btn" data-act="finish">End game<small>Leader wins</small></button>
      </div>
      <section class="panel"><p class="label">Up next</p>${upnext}</section>
      <section class="panel"><p class="label">This game</p>${log ? `<div class="log">${log}</div>` : `<p class="empty">Tap a +number under a name after each round.</p>`}</section>`;
  }

  function standings() {
    const rows = S.players.map((p) => ({ id: p.id, name: p.name, p: 0, w: 0, pf: 0, pa: 0 }));
    const by = Object.fromEntries(rows.map((r) => [r.id, r]));
    S.history.forEach((g) => {
      [[g.a, g.sa, g.sb], [g.b, g.sb, g.sa]].forEach(([id, f, a]) => {
        const r = by[id]; if (!r) return;
        r.p++; r.pf += f; r.pa += a; if (g.w === id) r.w++;
      });
    });
    rows.sort((x, y) => y.w - x.w || (y.p ? y.w / y.p : 0) - (x.p ? x.w / x.p : 0) || (y.pf - y.pa) - (x.pf - x.pa));
    return rows;
  }

  function viewTable() {
    const rows = standings();
    const any = S.history.length > 0;
    const body = rows.map((r, i) => {
      const pct = r.p ? Math.round((r.w / r.p) * 100) + "%" : "–";
      const diff = r.pf - r.pa;
      return `<tr class="${any && i === 0 && r.w > 0 && (rows[1] ? r.w > rows[1].w : true) ? "top" : ""}"><td>${esc(r.name)}</td><td class="big">${r.w}</td><td>${r.p - r.w}</td><td>${r.p}</td><td>${pct}</td><td>${diff > 0 ? "+" : ""}${diff}</td></tr>`;
    }).join("");
    const games = S.history.map((g, i) => {
      const winA = g.w === g.a;
      const wn = winA ? g.an : g.bn, ln = winA ? g.bn : g.an;
      const ws = winA ? g.sa : g.sb, ls = winA ? g.sb : g.sa;
      const time = new Date(g.ts).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      return `<div class="game"><span class="n">G${g.n}</span><div class="res"><b>${esc(wn)}</b> beat ${esc(ln)}<div>${time}</div></div><span class="sc">${ws}–${ls}<button class="x" data-act="delgame" data-i="${i}" aria-label="Delete game ${g.n}">×</button></span></div>`;
    }).join("");
    return `
      <h2 class="section">League table</h2>
      <section class="panel tablewrap">
        <table>
          <thead><tr><th>Player</th><th>Won</th><th>Lost</th><th>Pld</th><th>Win %</th><th>Pts +/−</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
        ${any ? "" : `<p class="empty">Finish a game and it lands here.</p>`}
      </section>
      <h2 class="section">Results</h2>
      <section class="panel">${games ? `<div class="games">${games}</div>` : `<p class="empty">No games finished yet tonight.</p>`}</section>
      ${any ? `<button class="btn danger" data-act="clearhist">Clear all results</button>` : ""}`;
  }

  function viewSetup() {
    const st = S.settings;
    const onTable = [S.game.a, S.game.b];
    const prow = S.players.map((p, i) => `
      <div class="prow">
        <span class="tag">${onTable.includes(p.id) ? "On" : "Off"}</span>
        <input type="text" id="pname-${p.id}" data-act="pname" data-id="${p.id}" value="${esc(p.name)}" maxlength="18" autocomplete="off" aria-label="Name for player ${i + 1}">
        <button class="x" data-act="delplayer" data-id="${p.id}" ${onTable.includes(p.id) || S.players.length <= 2 ? "disabled" : ""} aria-label="Remove ${esc(p.name)}">×</button>
      </div>`).join("");
    const targets = [11, 15, 21, 0].map((t) => `<button data-act="target" data-v="${t}" aria-pressed="${st.target === t}">${t || "None"}</button>`).join("");
    return `
      <h2 class="section">Players</h2>
      <section class="panel">
        ${prow}
        <button class="btn" data-act="addplayer">Add a player</button>
        <p class="hint">"On" means they're playing this game. Tap a name on the Play screen to rename too.</p>
      </section>

      <h2 class="section">Rules</h2>
      <section class="panel">
        <div class="field">
          <p class="label">Rotation</p>
          <div class="seg">
            <button data-act="mode" data-v="turns" aria-pressed="${st.mode === "turns"}">Take turns<small>Longest on sits out</small></button>
            <button data-act="mode" data-v="winner" aria-pressed="${st.mode === "winner"}">Winner stays<small>Loser sits out</small></button>
          </div>
        </div>
        <div class="field">
          <p class="label">Play to</p>
          <div class="seg">${targets}</div>
          <input type="number" id="target-custom" data-act="targetinput" inputmode="numeric" min="0" max="999" value="${st.target}" aria-label="Custom target score">
          <p class="hint">First to reach it wins. 0 or None means no target; use End game.</p>
        </div>
        <div class="field">
          <label class="label" for="buttons-input">Score buttons</label>
          <input type="text" id="buttons-input" data-act="buttons" inputmode="numeric" value="${st.buttons.join(", ")}" autocomplete="off">
          <p class="hint">Comma separated, up to 8. Standard pub table: 1, 2, 3 for the zones and 4 for a hanger off the end.</p>
        </div>
      </section>

      <h2 class="section">Start again</h2>
      <section class="panel">
        <div class="controls">
          <button class="btn" data-act="resetgame">Restart this game</button>
          <button class="btn danger" data-act="resetall">New night</button>
        </div>
        <p class="hint">New night clears every score and result but keeps names and rules. Everything saves on this phone.</p>
      </section>`;
  }

  // ---------- sheets ----------
  function openSheet(html) { $("#sheet-card").innerHTML = html; $("#sheet").hidden = false; }
  function closeSheet() { $("#sheet").hidden = true; $("#sheet-card").innerHTML = ""; }

  function openWin(side, auto) {
    const W = S.game[side], L = S.game[side === "a" ? "b" : "a"];
    const ws = total(side), ls = total(side === "a" ? "b" : "a");
    const nx = nextMatch(side);
    const next = nx.off ? `Next: <b>${esc(nameOf(nx.a))} v ${esc(nameOf(nx.b))}</b>. ${esc(nameOf(nx.off))} sits out.` : `Next: <b>${esc(nameOf(nx.a))} v ${esc(nameOf(nx.b))}</b> again.`;
    openSheet(`
      <p class="label eyebrow">${auto ? "Game over" : "End the game here?"}</p>
      <h3>${esc(nameOf(W))} wins</h3>
      <p class="final">${ws}–${ls}</p>
      <p class="hint">${esc(nameOf(L))} on ${ls}. ${next}</p>
      <button class="btn primary" data-act="commit" data-side="${side}">Start next game</button>
      ${auto ? `<button class="btn" data-act="undoclose">Wrong tap, undo it</button>` : `<button class="btn" data-act="close">Keep playing</button>`}`);
  }

  function openPick() {
    let sel = [S.game.a, S.game.b];
    const draw = () => {
      openSheet(`
        <p class="label">Pick two</p>
        <h3>Who's on the table?</h3>
        <div class="pick">${S.players.map((p) => `<button data-act="pickone" data-id="${p.id}" aria-pressed="${sel.includes(p.id)}">${esc(p.name)}</button>`).join("")}</div>
        <p class="hint">${S.game.log.length ? "This restarts the current game from 0–0." : "The first pick gets the red pucks."}</p>
        <button class="btn primary" data-act="pickgo" ${sel.length === 2 ? "" : "disabled"}>Start game</button>
        <button class="btn" data-act="close">Cancel</button>`);
    };
    pickState = { sel, draw };
    draw();
  }
  let pickState = null;

  function openRename(id) {
    openSheet(`
      <p class="label">Rename</p>
      <h3>${esc(nameOf(id))}</h3>
      <form id="rename-form" data-id="${id}"><div class="field">
        <input type="text" id="rename-input" value="${esc(nameOf(id))}" maxlength="18" autocomplete="off" aria-label="New name">
      </div></form>
      <button class="btn primary" data-act="renamego" data-id="${id}">Save</button>
      <button class="btn" data-act="close">Cancel</button>`);
    const inp = $("#rename-input");
    setTimeout(() => { inp.focus(); inp.select(); }, 50);
  }

  let confirmFn = null;
  function confirmSheet(title, body, okLabel, fn) {
    confirmFn = fn;
    openSheet(`<h3>${title}</h3><p class="hint">${body}</p>
      <button class="btn primary" data-act="confirmok">${okLabel}</button>
      <button class="btn" data-act="close">Cancel</button>`);
  }

  // ---------- helpers ----------
  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }
  function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
  function rename(id, name) {
    name = String(name || "").trim().slice(0, 18);
    if (!name) return;
    player(id).name = name;
    save();
  }

  // Keep the phone screen awake while scoring.
  let lock = null;
  async function wake() {
    try {
      if (!lock && "wakeLock" in navigator && document.visibilityState === "visible") {
        lock = await navigator.wakeLock.request("screen");
        lock.addEventListener("release", () => { lock = null; });
      }
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
  document.addEventListener("pointerdown", wake, { passive: true });

  // ---------- events ----------
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const act = el.dataset.act, d = el.dataset;
    switch (act) {
      case "tab": tab = d.tab; try { localStorage.setItem(KEY + ":tab", tab); } catch (e) {} render(); window.scrollTo(0, 0); break;
      case "add": addPoints(d.side, Number(d.v)); break;
      case "undo": undo(); break;
      case "undoclose": closeSheet(); undo(); break;
      case "finish": {
        const a = total("a"), b = total("b");
        if (a === b) { toast(a === 0 ? "No scores yet" : `Level at ${a}. Play another round.`); break; }
        openWin(a > b ? "a" : "b", false);
        break;
      }
      case "commit": commit(d.side); break;
      case "close": closeSheet(); break;
      case "pick": openPick(); break;
      case "pickone": {
        const s = pickState.sel, id = d.id;
        if (s.includes(id)) s.splice(s.indexOf(id), 1);
        else { s.push(id); if (s.length > 2) s.shift(); }
        pickState.draw();
        break;
      }
      case "pickgo": setPlayers(pickState.sel[0], pickState.sel[1]); closeSheet(); render(); break;
      case "rename": openRename(d.id); break;
      case "renamego": rename(d.id, $("#rename-input").value); closeSheet(); render(); break;
      case "confirmok": { const f = confirmFn; confirmFn = null; closeSheet(); f && f(); render(); break; }
      case "delgame": {
        const i = Number(d.i), g = S.history[i];
        confirmSheet(`Delete game ${g.n}?`, `${esc(g.an)} ${g.sa}–${g.sb} ${esc(g.bn)} comes off the league table.`, "Delete", () => { S.history.splice(i, 1); save(); });
        break;
      }
      case "clearhist": confirmSheet("Clear all results?", "Wipes the league table. Names and the current game stay.", "Clear results", () => { S.history = []; S.gameNo = 1; save(); }); break;
      case "addplayer": {
        const id = "p" + Date.now().toString(36);
        S.players.push({ id, name: `Player ${S.players.length + 1}` });
        S.queue.push(id); S.streak[id] = 0;
        save(); render();
        setTimeout(() => { const i = document.getElementById("pname-" + id); if (i) { i.focus(); i.select(); } }, 30);
        break;
      }
      case "delplayer": {
        const p = player(d.id);
        confirmSheet(`Remove ${esc(p.name)}?`, "Their past results stay in the results list.", "Remove", () => {
          S.players = S.players.filter((x) => x.id !== d.id);
          S.queue = S.queue.filter((x) => x !== d.id);
          save();
        });
        break;
      }
      case "mode": S.settings.mode = d.v; save(); render(); break;
      case "target": S.settings.target = Number(d.v); save(); render(); break;
      case "resetgame": confirmSheet("Restart this game?", `${esc(nameOf(S.game.a))} and ${esc(nameOf(S.game.b))} go back to 0–0.`, "Restart", () => { S.game = newGame(S.game.a, S.game.b); save(); }); break;
      case "resetall": confirmSheet("Start a new night?", "Clears every score and result. Names and rules stay.", "New night", () => {
        const keep = { players: S.players, settings: S.settings };
        const ids = keep.players.map((p) => p.id);
        S = { ...keep, game: newGame(ids[0], ids[1]), queue: ids.slice(2), streak: Object.fromEntries(ids.map((id) => [id, 0])), history: [], gameNo: 1 };
        save(); tab = "play";
      }); break;
    }
  });

  // Text inputs on the Setup screen save as you type.
  document.addEventListener("input", (ev) => {
    const el = ev.target, act = el.dataset && el.dataset.act;
    if (act === "pname") { rename(el.dataset.id, el.value); }
    else if (act === "targetinput") {
      const v = Math.max(0, Math.min(999, parseInt(el.value, 10) || 0));
      S.settings.target = v; save();
      document.querySelectorAll('[data-act="target"]').forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === v)));
    } else if (act === "buttons") {
      const vals = [...new Set(el.value.split(/[^0-9]+/).map((x) => parseInt(x, 10)).filter((n) => n > 0 && n < 100))].slice(0, 8);
      if (vals.length) { S.settings.buttons = vals; save(); }
    }
  });
  document.addEventListener("submit", (ev) => {
    if (ev.target.id === "rename-form") {
      ev.preventDefault();
      rename(ev.target.dataset.id, $("#rename-input").value); closeSheet(); render();
    }
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

  render();
})();
</script>
</body>
</html>
